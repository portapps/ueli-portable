name: update-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/update-app.yml'
      - 'build.properties'

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: update-app # secrets are gated by this environment
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      -
        name: GitHub auth token from GitHub App
        id: write-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAPPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PORTAPPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.write-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update ueli
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &update-script |
            const fs = require('fs');
            const path = require('path');
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: 'oliverschwendener',
              repo: 'ueli'
            });
            const version = /^v(\d+\.\d+\.\d+)$/.exec(release.tag_name)?.[1];
            if (!version) {
              throw new Error(`Unexpected ueli release tag: ${release.tag_name}`);
            }
            const archive = release.assets.find(asset =>
              asset.name.toLowerCase() === `ueli-${version}-win.zip`
            );
            if (!archive) {
              throw new Error(`No Windows ZIP found in ${release.html_url}`);
            }

            const file = path.join(process.env.GITHUB_WORKSPACE, 'build.properties');
            const original = fs.readFileSync(file, 'utf8');
            function property(name) {
              const match = original.match(new RegExp(`^${name.replaceAll('.', '\\.')}\\s*=\\s*(.+)$`, 'm'));
              if (!match) {
                throw new Error(`Missing ${name} in build.properties`);
              }
              return match[1].trim();
            }
            function replaceProperty(content, name, value) {
              const pattern = new RegExp(`^(${name.replaceAll('.', '\\.')}\\s*=\\s*).+$`, 'm');
              return content.replace(pattern, (_, prefix) => `${prefix}${value}`);
            }
            function compareVersions(left, right) {
              const a = left.split('.').map(Number);
              const b = right.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if (a[i] !== b[i]) {
                  return a[i] - b[i];
                }
              }
              return 0;
            }

            const currentVersion = property('app.version');
            if (!/^\d+\.\d+\.\d+$/.test(currentVersion)) {
              throw new Error(`Unexpected app.version: ${currentVersion}`);
            }
            const currentRelease = Number(property('app.release'));
            if (!Number.isSafeInteger(currentRelease) || currentRelease < 1) {
              throw new Error(`Unexpected app.release: ${currentRelease}`);
            }
            const comparison = compareVersions(version, currentVersion);
            if (comparison < 0) {
              throw new Error(`Latest upstream release ${version} is older than packaged ${currentVersion}`);
            }

            let updated = replaceProperty(original, 'app.version', version);
            updated = replaceProperty(updated, 'atf.win64.url', archive.browser_download_url);
            updated = replaceProperty(updated, 'app.release', String(currentRelease + (comparison > 0 ? 1 : 0)));
            if (updated !== original) {
              fs.writeFileSync(file, updated, 'utf8');
              core.info(`Updated build.properties to ueli ${version}`);
            } else {
              core.info('build.properties is already up to date');
            }
            core.setOutput('title', `ueli ${version}`);
            core.setOutput('version', version);
      -
        name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: update-ueli
          token: ${{ steps.write-app.outputs.token }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          signoff: true
          sign-commits: true
          delete-branch: true
          body: |
            This updates ueli to ${{ steps.update.outputs.version }}.

  diff:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update ueli
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *update-script
      -
        name: Show diff
        shell: pwsh
        run: |
          $diff = git --no-pager diff -- build.properties
          if ($diff) {
            $diff
          } else {
            Write-Host "No update diff."
          }
